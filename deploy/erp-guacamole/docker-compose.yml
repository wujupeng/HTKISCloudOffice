services:
  postgres:
    image: postgres:15
    container_name: erp-guac-postgres
    restart: always
    environment:
      POSTGRES_DB: erp_guacamole_db
      POSTGRES_USER: guacamole
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD}
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5435:5432"

  guacamole:
    image: guacamole/guacamole:latest
    container_name: erp-guacamole
    restart: always
    ports:
      - "127.0.0.1:8082:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GUACD_HOSTNAME: host.docker.internal
      GUACD_PORT: 4822
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: erp_guacamole_db
      POSTGRESQL_USER: guacamole
      POSTGRESQL_PASSWORD: ${ERP_DB_PASSWORD}
      GUACAMOLE_HOME: /etc/guacamole
    volumes:
      - ./guacamole-home:/etc/guacamole
    depends_on:
      - postgres

volumes:
  erp_pgdata: