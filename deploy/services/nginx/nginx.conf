worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name cloudesk.htkis.com _;

        client_max_body_size 50m;

        location = /auth {
            internal;
            proxy_pass http://127.0.0.1:5001/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Cookie $http_cookie;
        }

        location /guacamole/api/tokens {
            auth_request /auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = /api/email-auth/login-page;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Remote-User $auth_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /guacamole/api/ {
            auth_request /auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = /api/email-auth/login-page;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Remote-User $auth_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /guacamole/ {
            auth_request /auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = /api/email-auth/login-page;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Remote-User $auth_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<script>(function(){var _d=false;function _go(){if(_d)return;_d=true;fetch("/api/email-auth/logout",{method:"POST"}).finally(function(){window.location.href="/api/email-auth/login-page";});}function _chk(){var t=document.body.innerText||"";if(t.indexOf("\u60a8\u7684\u8fde\u63a5\u5df2\u65ad\u5f00")!==-1||t.indexOf("\u60a8\u5df2\u767b\u51fa")!==-1){_go();return true;}return false;}setInterval(function(){if(!_d)_chk();},2000);document.addEventListener("click",function(e){var n=e.target;while(n){if(n.getAttribute&&n.getAttribute("ng-click")){var c=n.getAttribute("ng-click");if(c.indexOf("logout")!==-1||c.indexOf("navigateHome")!==-1){_go();break;}}n=n.parentElement;}},true);})();</script></head>';
            sub_filter_once on;
            sub_filter_types text/html;
        }

        location /api/email-auth/ {
            proxy_pass http://127.0.0.1:5001/api/email-auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /screenshot/ {
            proxy_pass http://127.0.0.1:5002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        location = / {
            return 302 /guacamole/;
        }
    }

    server {
        listen 8080;
        server_name erp.oascii.com;

        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name erp.oascii.com;

        ssl_certificate /etc/letsencrypt/live/erp.oascii.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/erp.oascii.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        error_page 497 =301 https://$host:$server_port$request_uri;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        client_max_body_size 50m;

        location = /erp-auth {
            internal;
            proxy_pass http://127.0.0.1:5003/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Cookie $http_cookie;
        }

        location /guacamole/api/tokens {
            auth_request /erp-auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = /api/erp-auth/login-page;

            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Remote-User $auth_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /guacamole/api/ {
            auth_request /erp-auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = /api/erp-auth/login-page;

            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Remote-User $auth_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /guacamole/ {
            auth_request /erp-auth;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            error_page 401 = /api/erp-auth/login-page;

            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Remote-User $auth_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<script>(function(){var _d=false;function _go(){if(_d)return;_d=true;fetch("/api/erp-auth/logout",{method:"POST"}).finally(function(){window.location.href="/api/erp-auth/login-page";});}function _chk(){var t=document.body.innerText||"";if(t.indexOf("\u60a8\u7684\u8fde\u63a5\u5df2\u65ad\u5f00")!==-1||t.indexOf("\u60a8\u5df2\u767b\u51fa")!==-1){_go();return true;}return false;}setInterval(function(){if(!_d)_chk();},2000);document.addEventListener("click",function(e){var n=e.target;while(n){if(n.getAttribute&&n.getAttribute("ng-click")){var c=n.getAttribute("ng-click");if(c.indexOf("logout")!==-1||c.indexOf("navigateHome")!==-1){_go();break;}}n=n.parentElement;}},true);})();</script></head>';
            sub_filter_once on;
            sub_filter_types text/html;
        }

        location /api/erp-auth/ {
            proxy_pass http://127.0.0.1:5003/api/erp-auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = / {
            return 302 /guacamole/;
        }
    }
}
