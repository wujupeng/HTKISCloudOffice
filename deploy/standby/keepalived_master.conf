global_defs {
    router_id ERP_MASTER
}

vrrp_script check_nginx {
    script "/etc/keepalived/check_container.sh htkis-nginx"
    interval 5
    fall 3
    rise 2
}

vrrp_script check_erp_guac {
    script "/etc/keepalived/check_container.sh erp-guacamole"
    interval 5
    fall 3
    rise 2
}

vrrp_instance VI_ERP {
    state MASTER
    interface enp2s0
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ****REDACTED****
    }
    virtual_ipaddress {
        192.168.2.200/24
    }
    track_script {
        check_nginx
        check_erp_guac
    }
}
